<script>
const byId=id=>document.getElementById(id);
const lessons=JSON.parse(byId('lesson-data').textContent);
const selector=byId('lesson');
const practice=byId('practice');
const saved=lessons.map(lesson=>lesson.sets.map(set=>({picks:set.map(()=>null),checked:false,key:false})));
const currentSets=lessons.map(()=>0);
const letters='ABCD';
const safe=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
let current=0;
selector.innerHTML=lessons.map((item,i)=>'<option value="'+i+'">'+item.number+'. '+safe(item.title)+'</option>').join('');
byId('menu-count').textContent=lessons.length+' cấu trúc · 2 bài mỗi mục';
function active(){
 const set=currentSets[current];
 return {set,items:lessons[current].sets[set],state:saved[current][set]};
}
function renderLesson(){
 const lesson=lessons[current];
 selector.value=current;
 byId('prev').disabled=current===0;
 byId('next').disabled=current===lessons.length-1;
 byId('theory').innerHTML='<p class="meta">Lý thuyết · Cấu trúc '+lesson.number+'</p><h2>'+safe(lesson.title)+'</h2><p class="formula">'+safe(lesson.formula)+'</p><p>'+safe(lesson.note)+'</p><div class="example"><p>'+safe(lesson.example[0])+'</p><p>→ <strong>'+safe(lesson.example[1])+'</strong></p></div>';
 renderPractice();
}
function renderPractice(){
 const {set,items}=active();
 practice.innerHTML='<div class="quiz-top"><h2>Luyện tập</h2><span class="meta" id="progress"></span></div>'+
 '<div class="tabs" aria-label="Bài luyện">'+[0,1].map(i=>'<button type="button" class="btn" data-set="'+i+'" aria-pressed="'+(i===set)+'">Bài '+(i+1)+'</button>').join('')+'</div>'+
 '<p class="muted">Chọn câu có nghĩa gần nhất với câu gốc.</p>'+
 items.map((item,i)=>'<div class="question" data-question="'+i+'"><p class="prompt" id="q-'+i+'">'+(i+1)+'. '+safe(item.prompt)+'</p><div class="options" role="group" aria-labelledby="q-'+i+'">'+
 item.choices.map((choice,j)=>'<button type="button" class="option" data-choice="'+j+'" aria-pressed="false"><span>'+letters[j]+'.</span> '+safe(choice)+'</button>').join('')+
 '</div><p class="feedback" hidden></p></div>').join('')+
 '<div class="actions"><button type="button" class="btn primary" data-action="check">Kiểm tra đáp án</button><button type="button" class="btn" data-action="key">Xem đáp án</button><button type="button" class="btn" data-action="reset">Làm lại bài này</button></div><p class="status" id="status" role="status"></p>';
 update();
}
function update(){
 const {items,state}=active();
 let correct=0,answered=0;
 practice.querySelectorAll('.question').forEach((row,i)=>{
  const item=items[i], choice=state.picks[i], answer=item.choices.indexOf(item.answer);
  answered+=Number(choice!==null);
  correct+=Number(choice===answer);
  row.querySelectorAll('.option').forEach((button,j)=>{
   button.classList.toggle('chosen',choice===j);
   button.setAttribute('aria-pressed',String(choice===j));
   button.classList.toggle('right',(state.key||(state.checked&&choice===answer))&&answer===j);
   button.classList.toggle('wrong',state.checked&&choice===j&&choice!==answer);
  });
  const feedback=row.querySelector('.feedback');
  feedback.hidden=!(state.key||state.checked&&choice!==null);
  feedback.classList.toggle('good',state.key||choice===answer);
  feedback.textContent=state.key?letters[answer]+'. '+item.answer:choice===answer?'Đúng.':'Chưa đúng. Hãy thử lại.';
 });
 byId('progress').textContent=answered+' / '+items.length+' câu đã chọn';
 const line=byId('status');
 line.textContent=state.checked?'Đúng '+correct+' / '+items.length+' câu.'+(answered<items.length?' Chưa chọn '+(items.length-answered)+' câu.':''):'';
 practice.querySelector('[data-action="key"]').textContent=state.key?'Ẩn đáp án':'Xem đáp án';
}
selector.addEventListener('change',()=>{current=Number(selector.value);renderLesson()});
for(const [id,step] of [['prev',-1],['next',1]]) byId(id).addEventListener('click',()=>{
 current+=step;renderLesson();selector.focus();window.scrollTo(0,0);
});
practice.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button) return;
 if(button.hasAttribute('data-set')){
  const set=Number(button.dataset.set);
  currentSets[current]=set;renderPractice();practice.querySelector('[data-set="'+set+'"]').focus();return;
 }
 const {state}=active();
 if(button.hasAttribute('data-choice')){
  state.picks[Number(button.closest('.question').dataset.question)]=Number(button.dataset.choice);
  state.checked=false;
 }
 if(button.dataset.action==='check') state.checked=true;
 if(button.dataset.action==='key') state.key=!state.key;
 if(button.dataset.action==='reset'){state.picks.fill(null);state.checked=false;state.key=false;}
 update();
});
renderLesson();
</script>
